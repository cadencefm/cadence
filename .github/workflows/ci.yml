name: CI

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (full workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (headless no-default-features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Debug stack safety (cadence-engine)
        run: cargo test -p cadence-engine --lib
      - name: Workspace tests
        run: cargo test --workspace
      - name: Formats crate tests (all features)
        run: cargo test -p cadence-formats --all-features
      - name: Free debug test binaries before release build
        run: rm -rf target/debug
      - name: Audio invariants (release)
        run: cargo test --release --test audio_invariants

  test-macos:
    name: Test (macOS + Metal GPU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Debug stack safety (cadence-engine)
        run: cargo test -p cadence-engine --lib
      - name: Workspace tests (including headless Metal GPU suites)
        run: cargo test --workspace
      - name: Audio invariants (release)
        run: cargo test --release --test audio_invariants

  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        env:
          MDBOOK_VERSION: v0.5.4
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" mdbook
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build mdBook site
        run: mdbook build
